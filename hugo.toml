baseURL = 'https://aottr.dev/'
languageCode = 'en-us'
title = 'aottr'
theme = 'aottr'
copyright = "AlexOttr"

# Code Highlight
pygmentsstyle = "monokai"
pygmentscodefences = true
pygmentscodefencesguesssyntax = true

[pagination]
  pagerSize = 10
summaryLength = 30

disableHugoGeneratorInject = true
enableGitInfo = false
enableRobotsTXT = true

removePathAccents = true
enableEmoji = true

[params]
	mode="dark" # color-mode → light,dark,toggle or auto
	useCDN=true # don't use CDNs for fonts and icons, instead serve them locally.
	subtitle = "Thoughts on software development, data science, and other things."
	description = "Thoughts on software development, data science, and other things." # Used for SEO meta description
	author = "A. Ottr" # Author name for SEO and structured data
	mathjax = false # enable MathJax support
	katex = false # enable KaTeX support
    customcss = ["css/main_overrides.css", "css/dark_overrides.css"]
  
  # SEO: Add a default Open Graph image (1200x630px recommended)
  # og_image = "/img/og-image.png"
  og_image = ""
  # SEO: Add a favicon (32x32px or 16x16px)
  # favicon = "/favicon.ico"
  favicon = ""

[[params.social]]
name = "GitHub"
icon = "github"
url = "https://github.com/aottr"

[[params.social]]
name = "Twitter"
icon = "twitter"
url = "https://twitter.com/alexottr/"

[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "All posts"
url = "/posts"
weight = 2

# [[menu.main]]
# name = "About"
# url = "/about"
# weight = 3

[[menu.main]]
name = "Tags"
url = "/tags"
weight = 4

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = true

[permalinks]
  [permalinks.page]
    posts = '/posts/:year/:month/:slug/'
  [permalinks.section]
    posts = '/posts/'

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]

# Enable sitemap generation
[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"
